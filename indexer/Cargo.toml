[package]
name = "tern-projects"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tern-projects"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
fs2 = "0.4"
sysinfo = "0.30"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
